<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 14 / ABOUT — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 14 / ABOUT（会社・活動紹介）
  左にテキスト、右に写真・図の2カラム構成。見出し・本文・写真・理念を data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;padding-bottom:80px;align-items:center}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  .copy h2{margin:0 0 16px;font-size:clamp(24px,3.4vw,40px);font-weight:800;letter-spacing:-.02em}
  .copy p{margin:0 0 16px;color:#c3cada;font-size:15px;line-height:2}
  .copy .quote{margin:20px 0 0;padding-left:16px;border-left:2px solid var(--blue);color:var(--blue-2);font-size:14px;line-height:2}
  .media{aspect-ratio:4/5;border-radius:16px;border:1px solid var(--line);background:radial-gradient(120% 100% at 20% 0%,rgba(59,107,255,.25),transparent 60%),linear-gradient(180deg,#0b1020,#07080b);display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#5d6b8c;overflow:hidden}
  .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">ABOUT — 会社・活動紹介</p>
  <h1 data-reveal data-edit="main-headline">私たちについて。</h1>
  <p data-reveal data-edit="main-lead">左に本文、右に写真の2カラム構成です。見出し・本文・写真・理念を data-edit に差し替えてください。</p>
</header>
<section class="two wrap">
  <div class="copy" data-reveal>
    <h2 data-edit="about-title">ここに会社名・活動名</h2>
    <p data-edit="about-body1">本文1を差し替えます。何をしている組織かを、ここに入れます。</p>
    <p data-edit="about-body2">本文2を差し替えます。背景や想いをここに入れます。</p>
    <p class="quote" data-edit="about-quote">理念・ミッションの一文を差し替えます。</p>
  </div>
  <div class="media" data-reveal><!-- <img src="images/about.jpg" alt="会社紹介写真"> --><span data-edit="about-media">PHOTO / IMAGE</span></div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
