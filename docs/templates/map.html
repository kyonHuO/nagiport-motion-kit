<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 25 / MAP — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 25 / MAP（所在地）
  地図1枚＋住所・電話番号・営業時間・アクセスを data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding-bottom:80px}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .map-frame{border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:400px;background:radial-gradient(120% 100% at 30% 10%,rgba(59,107,255,.18),transparent 60%),linear-gradient(180deg,#0b1020,#07080b);display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#5d6b8c}
  .map-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .info{display:flex;flex-direction:column;gap:16px}
  .info .row{border:1px solid var(--line);border-radius:14px;padding:20px;background:linear-gradient(180deg,#0b0f18,#080b11)}
  .info .row .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--blue-2);margin-bottom:8px}
  .info .row p{margin:0;font-size:14px;color:#d3dae8;line-height:1.95}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">MAP — 所在地</p>
  <h1 data-reveal data-edit="main-headline">所在地。</h1>
  <p data-reveal data-edit="main-lead">地図1枚＋住所・電話番号・営業時間・アクセスを data-edit に差し替えてください。</p>
</header>
<section class="layout wrap">
  <div class="map-frame" data-reveal><!-- <iframe src="https://www.google.com/maps/embed?pb=..." title="所在地地図" allowfullscreen></iframe> --><span data-edit="map-ph">MAP PLACEHOLDER</span></div>
  <div class="info" data-reveal>
    <div class="row"><span class="k">ADDRESS</span><p data-edit="addr">東京都○○区○○ 1-1-1</p></div>
    <div class="row"><span class="k">TEL</span><p data-edit="tel">03-0000-0000</p></div>
    <div class="row"><span class="k">HOURS</span><p data-edit="hours">平日 10:00–18:00（土・日・祝休）</p></div>
    <div class="row"><span class="k">ACCESS</span><p data-edit="access">最寄り駅：○○駅より徒歩5分</p></div>
  </div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
