<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 17 / TIMELINE — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 17 / TIMELINE（歴史・歩み）
  年表を縦に並べる。日付・タイトル・説明を data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:820px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .timeline{padding-bottom:80px;position:relative}
  .timeline::before{content:"";position:absolute;left:90px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--blue),transparent)}
  .tl-item{display:grid;grid-template-columns:90px 1fr;gap:28px;padding:26px 0;position:relative}
  .tl-item .date{font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--blue-2);text-align:right}
  .tl-item .dot{position:absolute;left:85px;top:32px;width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(59,107,255,.18);z-index:1}
  .tl-item .body h3{margin:0 0 8px;font-size:18px;font-weight:700}
  .tl-item .body p{margin:0;color:var(--muted);font-size:14px;line-height:2;max-width:560px}
  @media (max-width:620px){.tl-item{grid-template-columns:1fr;gap:8px}.timeline::before{left:5px}.tl-item .date{text-align:left}.tl-item .dot{left:0;top:6px}}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">TIMELINE — 歩み・年表</p>
  <h1 data-reveal data-edit="main-headline">歩みを年表で伝える。</h1>
  <p data-reveal data-edit="main-lead">日付・タイトル・説明を data-edit に差し替えてください。</p>
</header>
<section class="timeline wrap">
  <div class="tl-item" data-reveal><span class="date" data-edit="d1">2024</span><span class="dot" aria-hidden="true"></span><div class="body"><h3 data-edit="t1">ここにタイトル1</h3><p data-edit="body1">説明1を差し替えます。</p></div></div>
  <div class="tl-item" data-reveal><span class="date" data-edit="d2">2025</span><span class="dot" aria-hidden="true"></span><div class="body"><h3 data-edit="t2">ここにタイトル2</h3><p data-edit="body2">説明2を差し替えます。</p></div></div>
  <div class="tl-item" data-reveal><span class="date" data-edit="d3">2026</span><span class="dot" aria-hidden="true"></span><div class="body"><h3 data-edit="t3">ここにタイトル3</h3><p data-edit="body3">説明3を差し替えます。増減は <div class="tl-item"> 行の複製で対応できます。</p></div></div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
