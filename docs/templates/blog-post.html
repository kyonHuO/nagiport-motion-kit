<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 22 / BLOG POST — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 22 / BLOG POST（記事本文）
  記事1件の本文。タイトル・日付・著者・本文・見出し・本文・引用・画像を
  data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:720px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(34px,5.6vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
  .meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px;color:var(--muted);font-size:13px}
  .meta span{font-family:var(--mono);font-size:11px;letter-spacing:.1em}
  .content{padding-bottom:80px;font-size:16px;line-height:2.1}
  .content p{margin:0 0 20px;color:#c3cada}
  .content h2{margin:36px 0 14px;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .content h3{margin:28px 0 12px;font-size:18px;font-weight:700}
  .content blockquote{margin:24px 0;padding-left:18px;border-left:3px solid var(--blue);color:var(--blue-2);font-size:15px;line-height:2}
  .content figure{margin:28px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 100% at 30% 10%,rgba(59,107,255,.2),transparent 60%),linear-gradient(180deg,#0b1020,#07080b);aspect-ratio:16/9;display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#5d6b8c}
  .content .tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
  .content .tags span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--blue-2);border:1px solid #2c3f78;border-radius:999px;padding:5px 12px}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">BLOG — 記事</p>
  <h1 data-reveal data-edit="title">ここに記事のタイトル</h1>
  <div class="meta" data-reveal>
    <span data-edit="date">2026.10.20</span>
    <span data-edit="author">山田 太郎</span>
    <span data-edit="read-time">5分</span>
  </div>
</header>
<article class="content wrap" data-reveal>
  <p data-edit="p1">記事本文の第一段を差し替えます。ここから記事の内容が始まります。日本語の長い文でも、この行間と余白のまま崩れにくいです。</p>
  <h2 data-edit="h1">小見出し1</h2>
  <p data-edit="p2">小見出し1の本文を差し替えます。</p>
  <blockquote data-edit="q1">引用を差し替えます。</blockquote>
  <figure data-edit="fig1">IMAGE PLACEHOLDER</figure>
  <h2 data-edit="h2">小見出し2</h2>
  <p data-edit="p3">小見出し2の本文を差し替えます。</p>
  <h3 data-edit="h3">さらに深い見出し</h3>
  <p data-edit="p4">ここも本文を差し替えます。</p>
  <div class="tags">
    <span data-edit="tag1">#タグ1</span>
    <span data-edit="tag2">#タグ2</span>
    <span data-edit="tag3">#タグ3</span>
  </div>
</article>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
