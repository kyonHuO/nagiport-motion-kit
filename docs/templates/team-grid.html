<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 32 / TEAM GRID — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 32 / TEAM GRID（チームグリッド・4人）
  4人のメンバーを2×2のグリッドで並べる。写真・名前・肩書・一言を
  data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:80px}
  @media (max-width:720px){.grid{grid-template-columns:1fr;max-width:480px;margin-inline:auto}}
  .member{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0c1019,#090c13);transition:border-color .2s ease,transform .2s ease}
  .member:hover{border-color:#3d4a72;transform:translateY(-3px)}
  .ph{aspect-ratio:16/10;background:radial-gradient(120% 100% at 30% 10%,rgba(59,107,255,.25),transparent 60%),linear-gradient(180deg,#0b1020,#07080b);display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#5d6b8c}
  .body{padding:20px;display:flex;flex-direction:column;gap:8px}
  .body .name{font-size:18px;font-weight:700}
  .body .role{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--blue-2)}
  .body .bio{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.9}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">TEAM GRID — チームグリッド・4人</p>
  <h1 data-reveal data-edit="main-headline">チーム（4人）。</h1>
  <p data-reveal data-edit="main-lead">4人のメンバーを2×2のグリッドで並べます。写真・名前・肩書・一言を data-edit に差し替えてください。</p>
</header>
<section class="grid wrap">
  <article class="member" data-reveal><div class="ph" data-edit="ph1">PHOTO 01</div><div class="body"><span class="name" data-edit="name1">山田 太郎</span><span class="role" data-edit="role1">REPRESENTATIVE</span><p class="bio" data-edit="bio1">一言を差し替えます。</p></div></article>
  <article class="member" data-reveal><div class="ph" data-edit="ph2">PHOTO 02</div><div class="body"><span class="name" data-edit="name2">佐藤 花子</span><span class="role" data-edit="role2">DESIGNER</span><p class="bio" data-edit="bio2">一言を差し替えます。</p></div></article>
  <article class="member" data-reveal><div class="ph" data-edit="ph3">PHOTO 03</div><div class="body"><span class="name" data-edit="name3">鈴木 一郎</span><span class="role" data-edit="role3">DEVELOPER</span><p class="bio" data-edit="bio3">一言を差し替えます。</p></div></article>
  <article class="member" data-reveal><div class="ph" data-edit="ph4">PHOTO 04</div><div class="body"><span class="name" data-edit="name4">高橋 美咲</span><span class="role" data-edit="role4">MARKETING</span><p class="bio" data-edit="bio4">一言を差し替えます。</p></div></article>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
