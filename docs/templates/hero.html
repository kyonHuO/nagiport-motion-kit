<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 01 / HERO — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 01 / HERO
  使い方：文言・画像を差し替えるだけで動きます。
  ・差し替え対象は data-edit 属性付きの要素だけ。
  ・サーバー・CLI不要。このファイルを置いて公開するだけ。
  ・prefers-reduced-motion は自動で尊重します。
-->
<style>
  :root{
    --bg:#07080b; --bg-2:#0b0e16; --fg:#f5f7fc; --muted:#98a2b6;
    --line:#1b2233; --blue:#3b6bff; --blue-2:#7fa0ff; --max:1200px;
    --sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;letter-spacing:.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){ .wrap{width:calc(100% - 32px)} }
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 22px}

  .hero{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(64px,10vw,120px) 0}
  .hero-bg{position:absolute;inset:-20% -10%;z-index:-2;pointer-events:none}
  .hero-bg .grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(120,150,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.09) 1px,transparent 1px);background-size:64px 64px;transform:perspective(900px) rotateX(56deg) translateY(6%);transform-origin:50% 100%;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 48%,transparent 82%)}
  .hero-bg .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .hero-bg .g1{width:46vmax;height:46vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,#1d3cff 0%,rgba(29,60,255,0) 62%)}
  .hero-bg .g2{width:38vmax;height:38vmax;right:-10vmax;top:2vmax;background:radial-gradient(circle,#7a4dff 0%,rgba(122,77,255,0) 64%);opacity:.35}
  .hero h1{margin:0;font-weight:800;letter-spacing:-.045em;line-height:1.02;font-size:clamp(46px,9.4vw,132px);text-wrap:balance}
  .hero h1 .accent{color:var(--blue);text-shadow:0 0 60px rgba(59,107,255,.35)}
  .hero-lead{max-width:680px;margin:30px 0 0;color:#c3cada;font-size:clamp(14px,1.5vw,17px);line-height:2}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 26px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid transparent;transition:transform .18s ease,background .18s ease,border-color .18s ease}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 40px rgba(59,107,255,.34)}
  .btn-primary:hover{background:#4d79ff}
  .btn-ghost{border-color:var(--line);color:#dfe5f2;background:rgba(255,255,255,.02)}
  .btn-ghost:hover{border-color:var(--blue);color:#fff}

  .hint{position:absolute;inset:auto 0 0 0;padding-bottom:28px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#7d8aa4}
  .hint .arrow{display:inline-block;animation:nudge 2.2s ease-in-out infinite;margin-right:10px}
  @keyframes nudge{0%,100%{transform:translateY(-1px)}50%{transform:translateY(4px)}}

  /* scroll reveal block — 本文へ続く演出 */
  .after{padding:clamp(72px,10vw,128px) 0;border-top:1px solid var(--line)}
  .after h2{margin:0 0 18px;font-size:clamp(28px,4vw,48px);letter-spacing:-.03em;font-weight:800}
  .after p{margin:0;color:var(--muted);font-size:15px;line-height:2;max-width:680px}

  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    [data-reveal]{opacity:1;transform:none;transition:none}
    .hero-bg .grid,.hero-bg .glow{animation:none}
    .hint .arrow{animation:none}
  }
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<section class="hero" id="top">
  <div class="hero-bg" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div></div>
  <div class="wrap">
    <p class="eyebrow" data-reveal>ここを差し替えてください — EYEBROW</p>
    <!-- 差し替え対象：data-edit 付きの要素を自社の文言に -->
    <h1 data-reveal data-edit="main-headline">あなたのサイトが<br><span class="accent">動き出す。</span></h1>
    <p class="hero-lead" data-reveal data-edit="main-lead">スクロールで切り替わる見出し、日本語の組み、スマホで崩れにくい余白。この一文を置き換えるだけで、あなたの言葉で動きます。</p>
    <div class="hero-actions" data-reveal>
      <a class="btn btn-primary" href="#next" data-edit="cta-primary">次のセクションへ <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="#" data-edit="cta-secondary">もう一つの導線</a>
    </div>
  </div>
  <div class="hint wrap"><span class="arrow" aria-hidden="true">↓</span>スクロールで進みます</div>
</section>

<section class="after" id="next">
  <div class="wrap">
    <h2 data-reveal>ここに本文が続きます。</h2>
    <p data-reveal>このブロックも差し替え対象です。ヒーローの下の導入文や、特徴の案内を置き換えてください。日本語の長い文でも、改行と行間はこのまま崩れにくい形に組まれています。</p>
  </div>
</section>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('[data-reveal]');
  if(reduce || !('IntersectionObserver' in window)){
    items.forEach(function(el){ el.classList.add('is-in'); });
  } else {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -8% 0px', threshold:0.12});
    items.forEach(function(el){ io.observe(el); });
  }
})();
</script>
</body>
</html>
