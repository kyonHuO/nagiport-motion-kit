<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 06 / PORTFOLIO — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 06 / PORTFOLIO（実績3点）
  実績・作品を3枚のカードで並べる。各カードのタイトル・説明・サムネイルを
  data-edit で差し替え。サムネイルは <img> を差し替えるか、そのままの
  グラデーションのプレースホルダーもそのまま使えます。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:80px}
  @media (max-width:900px){.grid3{grid-template-columns:1fr;max-width:480px;margin-inline:auto}}
  .item{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0c1019,#090c13);transition:border-color .2s ease,transform .2s ease}
  .item:hover{border-color:#3d4a72;transform:translateY(-3px)}
  .thumb{aspect-ratio:16/10;background:radial-gradient(120% 100% at 20% 0%,rgba(59,107,255,.25),transparent 60%),linear-gradient(180deg,#0b1020,#07080b);display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#5d6b8c}
  .body{display:flex;flex-direction:column;gap:10px;padding:20px;flex:1}
  .body h3{margin:0;font-size:18px;font-weight:700}
  .body p{margin:0;color:var(--muted);font-size:13px;line-height:1.9;flex:1}
  .body .link{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--blue-2)}
  .body .link:hover{color:#fff}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">PORTFOLIO — 実績</p>
  <h1 data-reveal data-edit="main-headline">実績を3点で伝える。</h1>
  <p data-reveal data-edit="main-lead">作品・実績を3枚のカードで並べます。サムネイル・タイトル・説明を data-edit に差し替えてください。</p>
</header>
<section class="grid3 wrap">
  <article class="item" data-reveal>
    <div class="thumb" data-edit="thumb1">IMAGE 01</div>
    <div class="body"><h3 data-edit="title1">実績1のタイトル</h3><p data-edit="desc1">実績1の説明を差し替えます。何ができて、何が変わったかをここに入れます。</p><a class="link" href="#" data-edit="link1">詳細を見る →</a></div>
  </article>
  <article class="item" data-reveal>
    <div class="thumb" data-edit="thumb2">IMAGE 02</div>
    <div class="body"><h3 data-edit="title2">実績2のタイトル</h3><p data-edit="desc2">実績2の説明を差し替えます。</p><a class="link" href="#" data-edit="link2">詳細を見る →</a></div>
  </article>
  <article class="item" data-reveal>
    <div class="thumb" data-edit="thumb3">IMAGE 03</div>
    <div class="body"><h3 data-edit="title3">実績3のタイトル</h3><p data-edit="desc3">実績3の説明を差し替えます。</p><a class="link" href="#" data-edit="link3">詳細を見る →</a></div>
  </article>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
