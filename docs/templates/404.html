<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 24 / 404 — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 24 / 404（ページが見つからない）
  404エラーの画面。大きな404、説明、トップへの導線を data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:900px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .err{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  .err-bg{position:absolute;inset:-20% -10%;z-index:-2;pointer-events:none}
  .err-bg .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
  .err-bg .g1{width:52vmax;height:52vmax;left:-16vmax;top:-22vmax;background:radial-gradient(circle,#1d3cff 0%,rgba(29,60,255,0) 62%)}
  .err-bg .g2{width:38vmax;height:38vmax;right:-10vmax;bottom:-16vmax;background:radial-gradient(circle,#7a4dff 0%,rgba(122,77,255,0) 66%);opacity:.3}
  .err .num{font-weight:800;letter-spacing:-.06em;line-height:.85;font-size:clamp(120px,28vw,300px);color:var(--blue);text-shadow:0 0 80px rgba(59,107,255,.4)}
  .err h1{margin:0;font-size:clamp(24px,4vw,40px);font-weight:700;letter-spacing:-.02em}
  .err p{margin:20px auto 0;color:var(--muted);max-width:440px;font-size:15px;line-height:2}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 28px;border-radius:999px;font-weight:700;font-size:14px;margin-top:34px;background:var(--blue);color:#fff;box-shadow:0 12px 40px rgba(59,107,255,.34);transition:transform .18s ease,background .18s ease}
  .btn:hover{background:#4d79ff}
  .btn:active{transform:translateY(1px)}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}.err-bg .glow{animation:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<section class="err" id="top">
  <div class="err-bg" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div></div>
  <div class="wrap">
    <div class="num" data-reveal>404</div>
    <h1 data-reveal data-edit="title">ページが見つかりません</h1>
    <p data-reveal data-edit="body">ページが見つかりません。削除されたか、URLが変更された可能性があります。</p>
    <a class="btn" href="/" data-reveal data-edit="cta">トップへ戻る <span aria-hidden="true">→</span></a>
  </div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
