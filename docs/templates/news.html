<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 10 / NEWS — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 10 / NEWS（記事・お知らせ一覧）
  3件のニュース・記事を並べる。日付・タイトル・要約を data-edit で差し替え。
  追加する場合は <article class="post">...</article> の行を複製してください。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:860px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .list{padding-bottom:80px;border-top:1px solid var(--line)}
  .post{border-bottom:1px solid var(--line);padding:28px 2px;display:flex;flex-direction:column;gap:8px;transition:background .2s ease}
  .post:hover{background:rgba(59,107,255,.03)}
  .post .date{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--blue-2)}
  .post h3{margin:0;font-size:18px;font-weight:700}
  .post p{margin:0;color:var(--muted);font-size:14px;line-height:2;max-width:700px}
  .post .link{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--blue-2);margin-top:4px}
  .post .link:hover{color:#fff}
  [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">NEWS — お知らせ・記事</p>
  <h1 data-reveal data-edit="main-headline">お知らせ。</h1>
  <p data-reveal data-edit="main-lead">3件のニュースを日付順で並べます。日付・タイトル・要約を data-edit に差し替えてください。</p>
</header>
<section class="list wrap">
  <article class="post" data-reveal>
    <span class="date" data-edit="d1">2026.10.20</span>
    <h3 data-edit="t1">記事1のタイトルを差し替えます</h3>
    <p data-edit="body1">記事1の要約を差し替えます。</p>
    <a class="link" href="#" data-edit="link1">続きを読む →</a>
  </article>
  <article class="post" data-reveal>
    <span class="date" data-edit="d2">2026.10.15</span>
    <h3 data-edit="t2">記事2のタイトルを差し替えます</h3>
    <p data-edit="body2">記事2の要約を差し替えます。</p>
    <a class="link" href="#" data-edit="link2">続きを読む →</a>
  </article>
  <article class="post" data-reveal>
    <span class="date" data-edit="d3">2026.10.01</span>
    <h3 data-edit="t3">記事3のタイトルを差し替えます</h3>
    <p data-edit="body3">記事3の要約を差し替えます。</p>
    <a class="link" href="#" data-edit="link3">続きを読む →</a>
  </article>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
