<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 18 / VIDEO — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 18 / VIDEO（動画紹介）
  動画1本を16:9で埋め込む。動画URLを差し替え、タイトル・説明文を data-edit で変更。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1000px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .player{padding-bottom:80px}
  .frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
  .frame iframe,.frame video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .frame .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#5d6b8c;background:radial-gradient(120% 100% at 30% 10%,rgba(59,107,255,.2),transparent 60%),linear-gradient(180deg,#0b1020,#07080b)}
  .cap{margin-top:16px;color:var(--muted);font-size:13px;text-align:center}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">VIDEO — 動画紹介</p>
  <h1 data-reveal data-edit="main-headline">動画で伝える。</h1>
  <p data-reveal data-edit="main-lead">動画1本を16:9で埋め込みます。動画URLを差し替え、タイトル・説明文を data-edit に置き換えてください。</p>
</header>
<section class="player wrap" data-reveal>
  <div class="frame">
    <!-- 差し替え：iframe の src、または <video> へ変更 -->
    <iframe src="" title="紹介動画" allowfullscreen></iframe>
    <div class="ph" data-edit="video-ph">VIDEO PLACEHOLDER</div>
  </div>
  <p class="cap" data-edit="video-cap">動画のキャプションを差し替えます。</p>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
