<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 30 / FEATURES — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 30 / FEATURES（特徴6点）
  6つの特徴を3×2のグリッドで並べる。各特徴の番号・タイトル・説明を
  data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:80px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
  .feat{border:1px solid var(--line);border-radius:16px;padding:26px;background:linear-gradient(180deg,#0b0f18,#080b11)}
  .feat .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--blue-2);margin-bottom:16px}
  .feat h3{margin:0 0 10px;font-size:18px;letter-spacing:-.01em}
  .feat p{margin:0;color:var(--muted);font-size:13px;line-height:1.95}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">FEATURES — 特徴6点</p>
  <h1 data-reveal data-edit="main-headline">特徴。</h1>
  <p data-reveal data-edit="main-lead">6つの特徴を3×2のグリッドで並べます。各特徴の番号・タイトル・説明を data-edit に差し替えてください。</p>
</header>
<section class="grid wrap">
  <div class="feat" data-reveal><div class="k" data-edit="f1-k">01 / 特徴</div><h3 data-edit="f1-title">特徴1のタイトル</h3><p data-edit="f1-body">特徴1の説明を差し替えます。</p></div>
  <div class="feat" data-reveal><div class="k" data-edit="f2-k">02 / 特徴</div><h3 data-edit="f2-title">特徴2のタイトル</h3><p data-edit="f2-body">特徴2の説明を差し替えます。</p></div>
  <div class="feat" data-reveal><div class="k" data-edit="f3-k">03 / 特徴</div><h3 data-edit="f3-title">特徴3のタイトル</h3><p data-edit="f3-body">特徴3の説明を差し替えます。</p></div>
  <div class="feat" data-reveal><div class="k" data-edit="f4-k">04 / 特徴</div><h3 data-edit="f4-title">特徴4のタイトル</h3><p data-edit="f4-body">特徴4の説明を差し替えます。</p></div>
  <div class="feat" data-reveal><div class="k" data-edit="f5-k">05 / 特徴</div><h3 data-edit="f5-title">特徴5のタイトル</h3><p data-edit="f5-body">特徴5の説明を差し替えます。</p></div>
  <div class="feat" data-reveal><div class="k" data-edit="f6-k">06 / 特徴</div><h3 data-edit="f6-title">特徴6のタイトル</h3><p data-edit="f6-body">特徴6の説明を差し替えます。</p></div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
