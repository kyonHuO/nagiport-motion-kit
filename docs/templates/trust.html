<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 20 / TRUST — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 20 / TRUST（信頼・実績ロゴ）
  「採用企業」などのロゴを横に並べる信頼感の帯。各ロゴを <img> に差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px;text-align:center}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px auto 0;color:var(--muted);max-width:560px}
  .band{padding-bottom:80px}
  .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  @media (max-width:720px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .logo{border:1px solid var(--line);border-radius:14px;height:120px;display:grid;place-items:center;background:linear-gradient(180deg,#0c1019,#090c13);overflow:hidden;transition:border-color .2s ease}
  .logo:hover{border-color:#3d4a72}
  .logo img{max-width:70%;max-height:70%;object-fit:contain;filter:grayscale(1) opacity(.6);transition:filter .2s ease}
  .logo:hover img{filter:grayscale(0) opacity(1)}
  .logo .ph{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:#5d6b8c}
  .note{margin-top:18px;text-align:center;color:#6d7a95;font-size:11px;font-family:var(--mono);letter-spacing:.1em}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">TRUST — 信頼・実績</p>
  <h1 data-reveal data-edit="main-headline">選ばれている。</h1>
  <p data-reveal data-edit="main-lead">採用企業などのロゴを横に並べる信頼感の帯です。各ロゴを <img> に差し替えてください。</p>
</header>
<section class="band wrap" data-reveal>
  <div class="row">
    <div class="logo"><!-- <img src="images/logo1.svg" alt="企業名1"> --><span class="ph" data-edit="l1">LOGO 01</span></div>
    <div class="logo"><!-- <img src="images/logo2.svg" alt="企業名2"> --><span class="ph" data-edit="l2">LOGO 02</span></div>
    <div class="logo"><!-- <img src="images/logo3.svg" alt="企業名3"> --><span class="ph" data-edit="l3">LOGO 03</span></div>
    <div class="logo"><!-- <img src="images/logo4.svg" alt="企業名4"> --><span class="ph" data-edit="l4">LOGO 04</span></div>
  </div>
  <p class="note" data-reveal data-edit="note">※ ロゴは差し替え例です。許諾を得た企業名・ロゴのみ掲載してください。</p>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
