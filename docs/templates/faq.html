<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 04 / FAQ — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 04 / FAQ（よくある質問）
  質問・回答を <details> で開閉。質問は summary、回答は .a の data-edit に差し替え。
  追加する場合は <details data-reveal>...</details> の行を複製してください。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:820px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 20px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted)}
  .faq{padding:20px 0 80px;border-top:1px solid var(--line)}
  .faq details{border-bottom:1px solid var(--line)}
  .faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 2px;font-size:16px;font-weight:600}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary .ic{flex:0 0 auto;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--blue-2);font-size:14px;transition:transform .2s ease}
  .faq details[open] summary .ic{transform:rotate(45deg)}
  .faq .a{padding:0 2px 26px;color:var(--muted);font-size:14px;line-height:2;max-width:720px}
  [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">FAQ — よくある質問</p>
  <h1 data-reveal data-edit="main-headline">よくある質問。</h1>
  <p data-reveal data-edit="main-lead">クリックで開閉する質問・回答です。質問は <summary>、回答は data-edit 付きの .a に差し替えてください。</p>
</header>
<section class="faq wrap">
  <details data-reveal><summary>質問1を差し替えます<span class="ic" aria-hidden="true">＋</span></summary><div class="a" data-edit="faq1-a">回答を差し替えます。長い日本語でもこのままで崩れにくいです。</div></details>
  <details data-reveal><summary>質問2を差し替えます<span class="ic" aria-hidden="true">＋</span></summary><div class="a" data-edit="faq2-a">回答を差し替えます。</div></details>
  <details data-reveal><summary>質問3を差し替えます<span class="ic" aria-hidden="true">＋</span></summary><div class="a" data-edit="faq3-a">回答を差し替えます。</div></details>
  <details data-reveal><summary>質問4を差し替えます<span class="ic" aria-hidden="true">＋</span></summary><div class="a" data-edit="faq4-a">回答を差し替えます。</div></details>
  <details data-reveal><summary>質問5を差し替えます<span class="ic" aria-hidden="true">＋</span></summary><div class="a" data-edit="faq5-a">回答を差し替えます。追加する場合はこの <details> 行を複製してください。</div></details>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
