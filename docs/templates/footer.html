<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 29 / FOOTER — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 29 / FOOTER（フッター）
  サイトフッター。ブランド・ナビ・SNS・著作権・プライバシーポリシーへの導線を
  data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1200px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .site-foot{border-top:1px solid var(--line);padding:46px 0 60px;color:#7b88a3;font-size:12px}
  .foot-in{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
  .foot-brand{font-family:var(--mono);letter-spacing:.2em;font-size:11px;color:#aab6cd}
  .foot-note{margin-top:10px;line-height:1.9;max-width:520px}
  .foot-links{display:flex;gap:18px;font-size:11px;color:#7b88a3}
  .foot-links a:hover{color:#fff}
  .foot-social{display:flex;gap:12px}
  .foot-social a{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;transition:border-color .18s ease,color .18s ease}
  .foot-social a:hover{border-color:var(--blue);color:#fff}
  .copy{margin-top:28px;color:#5f6b84;font-family:var(--mono);font-size:10px;letter-spacing:.16em}
  .demo{padding-bottom:80px}
  .demo .card{border:1px dashed #2a3350;border-radius:16px;padding:22px;background:linear-gradient(180deg,#0c1019,#090c13);color:#8894ad;font-size:13px}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">FOOTER — フッター</p>
  <h1 data-reveal data-edit="main-headline">フッター。</h1>
  <p data-reveal data-edit="main-lead">サイトフッターです。ブランド・ナビ・SNS・著作権・プライバシーポリシーへの導線を data-edit に差し替えてください。</p>
</header>
<section class="demo wrap" data-reveal>
  <div class="card">ここに本文が続きます。フッターの上には、本文やCTAを並べます。</div>
</section>
<footer class="site-foot">
  <div class="wrap foot-in">
    <div>
      <div class="foot-brand" data-edit="brand">NAGIPORT</div>
      <p class="foot-note" data-edit="note">フッターの注釈を差し替えます。会社名・住所・一言などを入れます。</p>
    </div>
    <div class="foot-links">
      <a href="#" data-edit="link1">ナビ1</a>
      <a href="#" data-edit="link2">ナビ2</a>
      <a href="#" data-edit="link3">ナビ3</a>
      <a href="#" data-edit="link4">ナビ4</a>
    </div>
    <div class="foot-social">
      <a href="#" aria-label="X / Twitter" data-edit="soc1">𝕏</a>
      <a href="#" aria-label="Instagram" data-edit="soc2">◎</a>
      <a href="#" aria-label="YouTube" data-edit="soc3">▶</a>
    </div>
  </div>
  <div class="wrap copy">© <span data-edit="year">2026</span> NAGIPORT <span data-edit="privacy">| プライバシーポリシー</span></div>
</footer>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
