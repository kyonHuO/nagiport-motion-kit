<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 33 / CTA SPLIT — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 33 / CTA SPLIT（2カラムCTA）
  左にテキスト、右に画像の2カラムCTA。見出し・本文・CTA・画像を
  data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1100px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 22px}
  .cta{position:relative;isolation:isolate;overflow:hidden;min-height:80svh;display:flex;align-items:center;padding:clamp(64px,10vw,120px) 0}
  .cta-bg{position:absolute;inset:-20% -10%;z-index:-2;pointer-events:none}
  .cta-bg .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .cta-bg .g1{width:46vmax;height:46vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,#1d3cff 0%,rgba(29,60,255,0) 62%)}
  .cta-bg .g2{width:34vmax;height:34vmax;right:-10vmax;top:2vmax;background:radial-gradient(circle,#7a4dff 0%,rgba(122,77,255,0) 64%);opacity:.35}
  .cta-bg .grid{position:absolute;inset:0;opacity:.4;background-image:linear-gradient(rgba(120,150,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.08) 1px,transparent 1px);background-size:64px 64px;transform:perspective(900px) rotateX(56deg) translateY(6%);transform-origin:50% 100%;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 48%,transparent 82%)}
  .two{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
  @media (max-width:820px){.two{grid-template-columns:1fr;gap:24px}}
  .copy h1{margin:0;font-weight:800;letter-spacing:-.045em;line-height:1.02;font-size:clamp(42px,8.6vw,108px);text-wrap:balance}
  .copy h1 .accent{color:var(--blue);text-shadow:0 0 60px rgba(59,107,255,.35)}
  .copy p{margin:30px 0 0;color:#c3cada;font-size:clamp(14px,1.5vw,17px);line-height:2;max-width:540px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 26px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid transparent;transition:transform .18s ease,background .18s ease,border-color .18s ease;margin-top:38px}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 40px rgba(59,107,255,.34)}
  .btn-primary:hover{background:#4d79ff}
  .media{aspect-ratio:4/3;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(120% 100% at 30% 10%,rgba(59,107,255,.25),transparent 60%),linear-gradient(180deg,#0b1020,#07080b);display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#5d6b8c}
  .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}.cta-bg .glow,.cta-bg .grid{animation:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<section class="cta" id="top">
  <div class="cta-bg" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div></div>
  <div class="wrap two">
    <div class="copy" data-reveal>
      <p class="eyebrow" data-edit="eyebrow">CTA SPLIT — 2カラムCTA</p>
      <h1 data-edit="main-headline">最後は2カラム<br><span class="accent">で締める。</span></h1>
      <p data-edit="main-lead">2カラムのCTAです。見出し・本文・CTA・画像を data-edit に差し替えてください。</p>
      <a class="btn btn-primary" href="#" data-edit="cta-primary">始める <span aria-hidden="true">→</span></a>
    </div>
    <div class="media" data-reveal><!-- <img src="images/cta.jpg" alt="CTA画像"> --><span data-edit="media-ph">IMAGE PLACEHOLDER</span></div>
  </div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
