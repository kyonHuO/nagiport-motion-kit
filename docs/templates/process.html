<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 09 / PROCESS — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 09 / PROCESS（流れ）
  3〜4ステップの工程を縦に並べる。各ステップの番号・タイトル・説明を
  data-edit で差し替え。ステップ数を増減したい場合は <div class="step"> 行を複製。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:820px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .steps{padding-bottom:80px;position:relative}
  .steps::before{content:"";position:absolute;left:27px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--blue),transparent)}
  .step{display:flex;gap:24px;padding:28px 0;position:relative}
  .step .num{flex:0 0 56px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,rgba(59,107,255,.25),rgba(59,107,255,.06));border:1px solid var(--blue);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue-2);position:relative;z-index:1}
  .step .body{flex:1}
  .step h3{margin:0 0 8px;font-size:20px;font-weight:700}
  .step p{margin:0;color:var(--muted);font-size:14px;line-height:2;max-width:600px}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">PROCESS — 流れ</p>
  <h1 data-reveal data-edit="main-headline">流れを伝える。</h1>
  <p data-reveal data-edit="main-lead">3〜4ステップの工程を縦に並べます。各ステップの番号・タイトル・説明を data-edit に差し替えてください。</p>
</header>
<section class="steps wrap">
  <div class="step" data-reveal><span class="num" data-edit="s1-num">01</span><div class="body"><h3 data-edit="s1-title">ここにステップ1</h3><p data-edit="s1-body">ステップ1の説明を差し替えます。まず何をするか、ここに入れます。</p></div></div>
  <div class="step" data-reveal><span class="num" data-edit="s2-num">02</span><div class="body"><h3 data-edit="s2-title">ここにステップ2</h3><p data-edit="s2-body">ステップ2の説明を差し替えます。</p></div></div>
  <div class="step" data-reveal><span class="num" data-edit="s3-num">03</span><div class="body"><h3 data-edit="s3-title">ここにステップ3</h3><p data-edit="s3-body">ステップ3の説明を差し替えます。</p></div></div>
  <div class="step" data-reveal><span class="num" data-edit="s4-num">04</span><div class="body"><h3 data-edit="s4-title">ここにステップ4</h3><p data-edit="s4-body">ステップ4の説明を差し替えます。増減は <div class="step"> 行の複製で対応できます。</p></div></div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
