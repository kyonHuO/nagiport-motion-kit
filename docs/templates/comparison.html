<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 16 / COMPARISON — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 16 / COMPARISON（比較表）
  2つの選択肢を機能ごとに比較する表。行・項目・チェックを data-edit で差し替え。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:920px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .table{padding-bottom:80px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .row{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row.head-row{background:#0c1019;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#8794af}
  .cell{padding:18px 20px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
  .cell.label{justify-content:flex-start;color:#dfe5f2}
  .cell .yes{color:var(--blue-2);font-weight:700}
  .cell .no{color:#5d6b8c}
  @media (max-width:620px){.row{grid-template-columns:1.2fr 1fr 1fr}.cell{padding:14px 12px;font-size:13px}}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">COMPARISON — 比較表</p>
  <h1 data-reveal data-edit="main-headline">違いを比較する。</h1>
  <p data-reveal data-edit="main-lead">2つの選択肢を機能ごとに並べる比較表です。行・項目・チェックを data-edit に差し替えてください。</p>
</header>
<section class="table wrap" data-reveal>
  <div class="row head-row"><span class="cell label">機能</span><span class="cell" data-edit="col-a">プランA</span><span class="cell" data-edit="col-b">プランB</span></div>
  <div class="row"><span class="cell label" data-edit="r1">項目1</span><span class="cell"><span class="yes">✓</span></span><span class="cell"><span class="yes">✓</span></span></div>
  <div class="row"><span class="cell label" data-edit="r2">項目2</span><span class="cell"><span class="no">—</span></span><span class="cell"><span class="yes">✓</span></span></div>
  <div class="row"><span class="cell label" data-edit="r3">項目3</span><span class="cell"><span class="no">—</span></span><span class="cell"><span class="no">—</span></span></div>
  <div class="row"><span class="cell label" data-edit="r4">項目4</span><span class="cell"><span class="yes">✓</span></span><span class="cell"><span class="yes">✓</span></span></div>
  <div class="row"><span class="cell label" data-edit="r5">項目5</span><span class="cell"><span class="yes">✓</span></span><span class="cell"><span class="yes">✓</span></span></div>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
