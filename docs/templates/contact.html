<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 05 / CONTACT — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 05 / CONTACT（問い合わせ）
  問い合わせフォームの見た目（名前・メールアドレス・本文・送信ボタン）。
  差し替え対象は data-edit 属性付きの要素。フォームの送信先（action）は
  差し替え手順で自社の方へ向けてください（現状は見た目だけのデモです）。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:980px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .layout{display:grid;grid-template-columns:1fr 1.1fr;gap:30px;padding-bottom:80px}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .info{border:1px solid var(--line);border-radius:18px;padding:30px;background:linear-gradient(180deg,#0b0f18,#080b11);display:flex;flex-direction:column;gap:16px}
  .info h2{margin:0;font-size:20px;font-weight:700}
  .info p{margin:0;color:var(--muted);font-size:14px;line-height:2}
  .info .row{display:flex;flex-direction:column;gap:2px;padding-top:14px;border-top:1px solid var(--line)}
  .info .row .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--blue-2)}
  form{display:flex;flex-direction:column;gap:16px}
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em}
  .field input,.field textarea{width:100%;background:#0b0f18;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--fg);font:inherit;font-size:14px;transition:border-color .18s ease}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
  .field textarea{min-height:160px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid var(--blue);background:var(--blue);color:#fff;transition:transform .18s ease,background .18s ease}
  .btn:hover{background:#4d79ff}
  .btn:active{transform:translateY(1px)}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">CONTACT — お問い合わせ</p>
  <h1 data-reveal data-edit="main-headline">お問い合わせ。</h1>
  <p data-reveal data-edit="main-lead">フォームの見た目を差し替えます。名前・メールアドレス・本文・送信ボタンの文言を置き換えてください。</p>
</header>
<div class="layout wrap">
  <aside class="info" data-reveal>
    <h2 data-edit="info-title">まずはこちらから</h2>
    <p data-edit="info-body">お問い合わせの内容を差し替えます。返信の目安や、まず見るポイントなどをここに入れます。</p>
    <div class="row"><span class="k">EMAIL</span><span data-edit="info-email">you@example.com</span></div>
    <div class="row"><span class="k">BUSINESS HOURS</span><span data-edit="info-hours">平日 10:00–18:00（例）</span></div>
    <div class="row"><span class="k">REPLY TIME</span><span data-edit="info-reply">2営業日以内（例）</span></div>
  </aside>
  <form data-reveal>
    <div class="field"><label for="n" data-edit="label-name">お名前</label><input id="n" name="name" type="text" placeholder="山田 太郎（例）"></div>
    <div class="field"><label for="e" data-edit="label-email">メールアドレス</label><input id="e" name="email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label for="m" data-edit="label-msg">本文</label><textarea id="m" name="message" placeholder="お問い合わせ内容（例）"></textarea></div>
    <button class="btn" type="submit" data-edit="cta-submit">送信する <span aria-hidden="true">→</span></button>
  </form>
</div>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
