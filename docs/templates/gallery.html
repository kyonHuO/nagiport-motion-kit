<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>テンプレート 13 / GALLERY — Nagiport Motion Kit</title>
<!--
  Nagiport Motion Kit — TEMPLATE 13 / GALLERY（画像ギャラリー）
  画像をグリッドで並べる。各セルの <img> を差し替え、alt・キャプションを data-edit で変更。
  画像なしの状態はグラデーションのプレースホルダーで代用できます。
-->
<style>
  :root{--bg:#07080b;--fg:#f5f7fc;--muted:#98a2b6;--line:#1b2233;--blue:#3b6bff;--blue-2:#7fa0ff;--max:1160px;--sans:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blue);color:#fff}
  .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
  @media (max-width:560px){.wrap{width:calc(100% - 32px)}}
  .skip{position:fixed;top:10px;left:10px;z-index:100;background:#fff;color:#000;padding:10px 14px;border-radius:6px;transform:translateY(-200%)}
  .skip:focus{transform:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue-2);text-transform:uppercase;margin:0 0 20px}
  .head{padding:clamp(64px,10vw,120px) 0 24px}
  .head h1{margin:0;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.04em}
  .head p{margin:18px 0 0;color:var(--muted);max-width:560px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:80px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
  .cell{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);aspect-ratio:4/3;background:radial-gradient(120% 100% at 20% 0%,rgba(59,107,255,.2),transparent 60%),linear-gradient(180deg,#0b1020,#07080b)}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cell .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#5d6b8c}
  .cell .cap{position:absolute;inset:auto 0 0 0;padding:14px 16px;font-size:12px;color:#dfe5f2;background:linear-gradient(180deg,transparent,rgba(7,8,11,.85))}
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].is-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1;transform:none;transition:none}}
</style>
<noscript><style>[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body>
<a class="skip" href="#top">本文へ</a>
<header class="head wrap" id="top">
  <p class="eyebrow" data-reveal data-edit="eyebrow">GALLERY — ギャラリー</p>
  <h1 data-reveal data-edit="main-headline">画像で伝える。</h1>
  <p data-reveal data-edit="main-lead">画像をグリッドで並べます。各セルの <img> を差し替え、alt とキャプションを data-edit に置き換えてください。</p>
</header>
<section class="grid wrap">
  <figure class="cell" data-reveal><!-- <img src="images/1.jpg" alt="写真1の説明"> --><div class="ph" data-edit="ph1">IMAGE 01</div><figcaption class="cap" data-edit="cap1">写真1のキャプション</figcaption></figure>
  <figure class="cell" data-reveal><!-- <img src="images/2.jpg" alt="写真2の説明"> --><div class="ph" data-edit="ph2">IMAGE 02</div><figcaption class="cap" data-edit="cap2">写真2のキャプション</figcaption></figure>
  <figure class="cell" data-reveal><!-- <img src="images/3.jpg" alt="写真3の説明"> --><div class="ph" data-edit="ph3">IMAGE 03</div><figcaption class="cap" data-edit="cap3">写真3のキャプション</figcaption></figure>
  <figure class="cell" data-reveal><!-- <img src="images/4.jpg" alt="写真4の説明"> --><div class="ph" data-edit="ph4">IMAGE 04</div><figcaption class="cap" data-edit="cap4">写真4のキャプション</figcaption></figure>
  <figure class="cell" data-reveal><!-- <img src="images/5.jpg" alt="写真5の説明"> --><div class="ph" data-edit="ph5">IMAGE 05</div><figcaption class="cap" data-edit="cap5">写真5のキャプション</figcaption></figure>
  <figure class="cell" data-reveal><!-- <img src="images/6.jpg" alt="写真6の説明"> --><div class="ph" data-edit="ph6">IMAGE 06</div><figcaption class="cap" data-edit="cap6">写真6のキャプション</figcaption></figure>
</section>
<script>
(function(){var r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;var it=document.querySelectorAll('[data-reveal]');if(r||!('IntersectionObserver' in window)){it.forEach(function(e){e.classList.add('is-in');});}else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.12});it.forEach(function(e){io.observe(e);});}})();
</script>
</body>
</html>
